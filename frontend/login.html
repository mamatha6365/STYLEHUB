
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleHub | Login</title>

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/footer.css">
</head>

<body>

<header class="navbar">

    <div class="navbar-container">

        <a href="index.html" class="logo">
            Style<span>Hub</span>
        </a>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-actions">
            <a href="cart.html">🛒</a>
            <button id="menuButton">☰</button>
        </div>

    </div>

    <div id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</header>


<section class="auth-section">

    <form id="loginForm" class="auth-box">

        <h1>Welcome Back</h1>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required>


        <button type="submit">
            Login
        </button>

        <p class="auth-link">
            Don't have an account?
            <a href="register.html">
                Create Account
            </a>
        </p>

    </form>

</section>


<footer class="footer">

    <div class="footer-container">

        <div>
            <h2 class="footer-logo">
                Style<span>Hub</span>
            </h2>

            <p>
                Premium fashion for modern lifestyles.
            </p>
        </div>

        <div>
            <h3>Shop</h3>

            <ul class="footer-links">
                <li><a href="products.html">Products</a></li>
                <li><a href="products.html?category=Men">Men</a></li>
                <li><a href="products.html?category=Women">Women</a></li>
                <li><a href="products.html?category=Kids">Kids</a></li>
            </ul>
        </div>

        <div>
            <h3>Company</h3>

            <ul class="footer-links">
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>

    </div>

    <div class="footer-bottom">
        <p>
            © <span data-year></span>
            StyleHub. All Rights Reserved.
        </p>
    </div>

</footer>


<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/login.js"></script>

</body>
</html>
